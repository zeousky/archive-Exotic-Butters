<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Puter.js Chat Example</title>
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <h1>Puter.js Chat Example</h1>
    <pre id="out"></pre>

    <script>
      const out = document.getElementById('out');

      async function run() {
        out.textContent += 'Requesting a response...\n\n';

        const response = await puter.ai.chat(
          'Explain quantum computing in simple terms',
          { model: 'claude-sonnet-4-6' }
        );

        // The Puter response contains message.content array
        const text = response?.message?.content?.[0]?.text || JSON.stringify(response, null, 2);
        out.textContent += text + '\n\n';
        out.textContent += 'Done.';
      }

      run().catch(err => { out.textContent += 'Error: ' + err.toString(); });
    </script>
  </body>
</html>
